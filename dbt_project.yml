name: poc
version: "1.0.0"
profile: poc

# 1.12+ so dbt reads .env on its own.
require-dbt-version: [">=1.12.0", "<2.0.0"]

clean-targets: ["target", "dbt_packages"]

# bronze: raw data as it lands (seeds and files loaded from data/)
# silver: cleaned and typed (staging views, snapshots)
# gold:   tables people actually query

seeds:
  poc:
    +schema: bronze

snapshots:
  poc:
    +schema: silver

models:
  poc:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
