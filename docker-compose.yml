# Local Postgres. Settings come from .env if you have one, otherwise the defaults below.
# Data is kept in a volume, so it survives restarts. `docker compose down -v` wipes it.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt}
      POSTGRES_DB: ${POSTGRES_DB:-poc}
    ports:
      # localhost only, so it isn't exposed on shared networks
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ mounts here (not /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
